{{define "content"}}
    <h1 class="sr-only">Boop 首页</h1>

    {{if .Composer}}
    <!-- 快捷发布器：仅站长登录时由服务端渲染，读者与游客 DOM 中不存在 -->
    <section class="composer" id="composer" data-composer aria-label="快捷发布" tabindex="-1">
      <span class="avatar" aria-hidden="true"><svg viewBox="0 0 48 48"><use href="#i-avatar"/></svg></span>
      <form class="composer-body" data-composer-form action="/api/v1/admin/posts" method="post">
        <label class="sr-only" for="composer-text">分享此刻发生的事</label>
        <textarea class="composer-input" id="composer-text" data-composer-text rows="1"
          placeholder="分享此刻发生的事…" aria-label="分享此刻发生的事"></textarea>

        <div class="composer-extra" data-composer-extra hidden>
          <label class="sr-only" for="composer-title">文章标题</label>
          <input class="composer-title" id="composer-title" data-composer-title type="text" maxlength="160"
            placeholder="添加标题" aria-label="文章标题" hidden>

          <div class="composer-drop" data-composer-drop hidden>
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-image"/></svg>
            <label class="composer-pick" for="composer-file">选择图片</label>
            <input class="sr-only" id="composer-file" data-composer-file type="file"
              accept="image/jpeg,image/png,image/webp,image/gif" aria-describedby="composer-file-hint">
            <span class="composer-drop-hint" id="composer-file-hint" data-composer-file-hint>支持 jpg、png、webp、gif；选图后立即上传，发布时使用已上传的图片。</span>
            <img class="composer-preview" data-composer-preview alt="待发布的图片预览" hidden>
          </div>

          <label class="sr-only" for="composer-tags">标签</label>
          <input class="composer-extra-input" id="composer-tags" data-composer-tags type="text" maxlength="200"
            placeholder="标签，用逗号分隔" aria-label="标签" hidden>

          <label class="sr-only" for="composer-excerpt">摘要</label>
          <input class="composer-extra-input" id="composer-excerpt" data-composer-excerpt type="text" maxlength="300"
            placeholder="摘要（可选）" aria-label="摘要" hidden>

          <div class="composer-bar">
            <div class="pick" role="group" aria-label="内容类型">
              <button class="pick-opt" type="button" data-mode="moment" aria-pressed="{{if eq .ComposerMode "moment"}}true{{else}}false{{end}}">动态</button>
              <button class="pick-opt" type="button" data-mode="article" aria-pressed="{{if eq .ComposerMode "article"}}true{{else}}false{{end}}">文章</button>
              <button class="pick-opt" type="button" data-mode="photo" aria-pressed="{{if eq .ComposerMode "photo"}}true{{else}}false{{end}}">摄影</button>
            </div>
            <span class="composer-count" data-composer-count aria-hidden="true">0/2000</span>
            <button class="composer-post" data-composer-submit type="submit" disabled>发布</button>
          </div>
          <p class="composer-error" data-composer-error role="alert" hidden></p>
        </div>
      </form>
      <noscript>
        <p class="composer-error">发布需要 JavaScript：页面会把内容以 JSON 提交到站内接口。</p>
      </noscript>
    </section>
    {{end}}

    <div class="stream" id="stream">
      {{if .Empty}}
      <p class="empty">这里还没有公开内容。</p>
      {{end}}
      {{range .Posts}}{{template "feedCard" .}}{{end}}
    </div>

    {{if .LoadMoreURL}}
    <p class="stream-more"><a class="load-more" href="{{.LoadMoreURL}}">加载更多</a></p>
    {{end}}

    <p class="stream-end">Boop 上只有站长会发布内容，读者可以注册后参与评论与收藏</p>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden><span class="toast-msg" data-toast-message></span></div>
{{end}}
